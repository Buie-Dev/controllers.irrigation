

services:
  irrigation-controller:
    network_mode: "host"
    build:
      context: .
      network: host
    container_name: irrigation-controller
    environment:
      CONFIG_FILE: /run/secrets/config.json
      TZ: America/Vancouver
    volumes:
      - .:/app  # Mount current directory to /app in the container
    env_file:
      - .env 
    restart: always  # Restart if the container crashes
    command: ["python", "-u", "index.py"]
    privileged: true

